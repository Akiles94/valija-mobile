name: CI

# This workflow lives in valija-mobile and only in valija-mobile. The valija repository gets no
# mobile CI at all (P-11): its own ci.yml matrix must stay untouched and unslowed.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # The drift gate. No SQLite, no C, no device, no emulator -- if this is red, no device run is
  # worth taking.
  domain:
    name: Domain conformance (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Byte-compare both expected packs
        run: ./gradlew :vault-core:jvmTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-conformance
          path: vault-core/build/reports/tests/jvmTest/

  # NOTE: this job runs on an x86_64 emulator. It is NOT the arm64 evidence for G2 -- the
  # physical-device run is. The job name and the log both say x86_64 so no reader can mistake it.
  android:
    name: Android build + x86_64 emulator (NOT arm64 evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app (NDK compiles the vendored C for arm64-v8a and x86_64)
        run: ./gradlew :composeApp:assembleDebug

      - name: "Record the APK's declared permissions (expected: none)"
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "SDK root: ${SDK:-<unset>}"
          APK="$(find composeApp/build/outputs/apk -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK found under composeApp/build/outputs/apk"
            find composeApp/build/outputs -type f | head -50
            exit 1
          fi
          echo "APK: $APK"
          AAPT2="$(find "$SDK/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -1)"
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 not found under $SDK/build-tools"
            ls -la "$SDK/build-tools" || true
            exit 1
          fi
          echo "aapt2: $AAPT2"
          "$AAPT2" dump badging "$APK" > android-permissions.txt
          echo "--- permissions declared ---"
          grep -E "uses-permission|^package" android-permissions.txt || echo "(none)"
          if grep -q "uses-permission" android-permissions.txt; then
            echo "::error::The APK declares a permission. This app must declare none."
            exit 1
          fi

      - name: Enable KVM for a natively-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: On-device conformance (x86_64 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./gradlew :vault-interop:connectedAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-x86_64-emulator
          path: |
            android-permissions.txt
            vault-interop/build/reports/androidTests/
            composeApp/build/outputs/apk/debug/

  # NOTE: this job runs on the iOS *simulator*. arm64 ISA and real iOS frameworks, but the macOS
  # kernel and a simulator runtime -- it proves nothing about code signing, entitlements, the
  # Secure Enclave, background suspension, thermals or App Store review.
  ios:
    name: iOS simulator (NOT a physical device)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the vendored C for both Apple targets
        run: |
          ./gradlew :vault-interop:buildAppleNativeIosSimulatorArm64 \
                    :vault-interop:buildAppleNativeIosArm64

      - name: Cinterop conformance on the simulator
        run: ./gradlew :vault-interop:iosSimulatorArm64Test

      - name: Link the device (iphoneos) framework — compile+link only, never executed here
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: vault-interop/build/reports/tests/
